name: Build Android 15 Kernel 6.6 development package

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish or replace the permanent GitHub Release asset"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: android15-6.6-aarch64-devkit
  cancel-in-progress: false

jobs:
  build-devkit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      LYENV_HOME: ${{ github.workspace }}/.lyenv_home
      DEVKIT_OUTPUT: ${{ runner.temp }}/kernel-devkit-output
      DEVKIT_ARCHIVE: ${{ runner.temp }}/kernel-devkit-output/android15-6.6-aarch64-devkit.tar.zst
      DEVKIT_CHECKSUM: ${{ runner.temp }}/kernel-devkit-output/android15-6.6-aarch64-devkit.tar.zst.sha256

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install bootstrap dependencies
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y make git curl python3 python3-pip zstd

      - name: Checkout pinned kade plugin
        uses: actions/checkout@v4
        with:
          repository: systemnb/lyenv-plugin-center
          ref: f24571af839a32f360593d13676336a4132b4966
          path: _kade-plugin-center
          sparse-checkout: |
            plugins/kade
          sparse-checkout-cone: true

      - name: Restore build caches
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.LYENV_HOME }}/cache
            ${{ env.LYENV_HOME }}/ccache
            ${{ env.LYENV_HOME }}/bazel-cache
          key: kernel-devkit-android15-6.6-${{ runner.os }}-${{ hashFiles('kadeflow-devkit-6.6.yaml', 'abi.symbols') }}
          restore-keys: |
            kernel-devkit-android15-6.6-${{ runner.os }}-
            kade-cache-${{ runner.os }}-

      - name: Install lyenv
        run: |
          set -eux
          mkdir -p "${LYENV_HOME}"
          git clone https://github.com/systemnb/lyenv "${GITHUB_WORKSPACE}/_lyenv"
          make -C "${GITHUB_WORKSPACE}/_lyenv" install

      - name: Create kade project
        run: |
          set -eux
          lyenv create ci-kade-devkit
          cd ci-kade-devkit
          lyenv init .
          eval "$(lyenv activate)"
          which lyenv

      - name: Build Android 15 GKI 6.6
        run: |
          set -eux
          python3 -m pip install --user pyyaml
          cd "${GITHUB_WORKSPACE}/ci-kade-devkit"
          eval "$(lyenv activate)"
          python3 "${GITHUB_WORKSPACE}/.github/scripts/run_kadeflow.py" \
            --config "${GITHUB_WORKSPACE}/kadeflow-devkit-6.6.yaml" \
            --debug \
            --log-file "${GITHUB_WORKSPACE}/kadeflow-devkit.log"

      - name: Package DDK and kernel prebuilts
        run: |
          set -eux
          bash "${GITHUB_WORKSPACE}/.github/scripts/package_kernel_devkit.sh" \
            "${GITHUB_WORKSPACE}/ci-kade-devkit/workspace/android-kernel" \
            "${DEVKIT_OUTPUT}"

      - name: Upload development package artifact
        uses: actions/upload-artifact@v4
        with:
          name: android15-6.6-aarch64-devkit
          path: |
            ${{ env.DEVKIT_ARCHIVE }}
            ${{ env.DEVKIT_CHECKSUM }}
            ${{ github.workspace }}/kadeflow-devkit.log
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Publish permanent release asset
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: android15-6.6-aarch64-devkit
        run: |
          set -eux
          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" \
              --target "${GITHUB_SHA}" \
              --title "Android 15 Kernel 6.6 AArch64 development package" \
              --notes "Reusable Kleaf DDK prebuilts generated from common-android15-6.6."
          fi
          gh release upload "${RELEASE_TAG}" \
            "${DEVKIT_ARCHIVE}" \
            "${DEVKIT_CHECKSUM}" \
            --clobber

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android15-6.6-devkit-failure-log
          path: ${{ github.workspace }}/kadeflow-devkit.log
          if-no-files-found: warn
          retention-days: 30
